backend:
  name: turbo-github
  turbo_site_id: "1f5aa061-6bbb-4422-b9b0-ca0e77514884"
  branch: main
  base_url: https://app.decapcms.org

media_folder: "assets/uploads"
public_folder: "assets/uploads"

collections:
  - name: "portfolio"
    label: "Portfolio Projects"
    files:
      - file: "data/projects.json"
        label: "Projects Gallery"
        name: "projects_list"
        fields:
          - label: "Projects"
            name: "projects"
            widget: "list"
            summary: '{{fields.title}} ({{fields.category}})'
            fields:
              - { label: "Project Title", name: "title", widget: "string" }
              - { label: "Category", name: "category", widget: "string" }
              - { label: "Client Name", name: "client", widget: "string", required: false }
              - { label: "Year", name: "year", widget: "string", required: false }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Thumbnail Image", name: "thumbnail", widget: "image" }
